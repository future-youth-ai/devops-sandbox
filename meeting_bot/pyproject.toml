[project]
name = "meeting-bot"
version = "0.1.0"
description = "飞书会议妙记自动化 - Webhook → 云文档 + Bitable + 任务 + 群消息 + 邮件"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "jinja2>=3.1.4",
    "aiosmtplib>=3.0.2",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "bandit[toml]==1.7.10",
    "pip-audit==2.7.3",
    "pre-commit>=3.8",
    "respx>=0.21.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "N", "S", "RUF", "ASYNC"]
ignore = ["E501", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N"]
"scripts/**/*.py" = ["S603", "S607", "S110", "RUF001", "RUF002", "RUF003", "N818", "SIM105", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["meeting_bot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = true

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src/meeting_bot",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=30",
]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/meeting_bot"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---------- bandit ----------
[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv"]
skips = ["B101"]
