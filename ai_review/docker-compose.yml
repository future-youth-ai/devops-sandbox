version: "3.9"

services:
  ai-review:
    build: .
    image: ai-review:latest
    container_name: ai-review
    restart: unless-stopped
    ports:
      - "8001:8000"  # 避免和 meeting_bot 冲突
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
