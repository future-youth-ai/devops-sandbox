name: ai_review CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ai_review/**'
      - 'scripts/**'
      - '.github/workflows/ai-review-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ai_review/**'
      - 'scripts/**'
      - '.github/workflows/ai-review-ci.yml'

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

env:
  PYTHON_VERSION: "3.11"

defaults:
  run:
    working-directory: ai_review

jobs:
  lint:
    name: ai_review / Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install "ruff==0.6.9"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  typecheck:
    name: ai_review / Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install "mypy==1.11.2"
      - run: |
          if [ -d src ]; then
            mypy src
          else
            echo "::warning::src/ 目录为空, 跳过 mypy"
          fi

  test:
    name: ai_review / Test (pytest)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pytest pytest-cov
      - run: |
          if [ -d tests ] && [ -n "$(ls -A tests 2>/dev/null)" ]; then
            pytest
          else
            echo "::warning::tests/ 目录为空, 跳过 (初始化阶段允许)"
            echo '<?xml version="1.0" ?><coverage version="7.0"><packages/></coverage>' > coverage.xml
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-coverage
          path: ai_review/coverage.xml
          retention-days: 14

  security-sast:
    name: ai_review / SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "bandit[toml]==1.7.10"
      - run: bandit -c pyproject.toml -r src -f sarif -o bandit.sarif || true
      - run: bandit -c pyproject.toml -r src -ll
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ai_review/bandit.sarif
          category: ai_review-bandit
        continue-on-error: true

  security-sca:
    name: ai_review / SCA (pip-audit + TruffleHog)
    runs-on: ubuntu-latest
    env:
      TRUFFLE_BASE: ${{ github.event.pull_request.base.sha }}
      TRUFFLE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "pip-audit==2.7.3"
      - run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc --strict
          else
            pip-audit --desc || echo "::warning::pip-audit warnings"
          fi
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./ai_review
          base: ${{ env.TRUFFLE_BASE }}
          head: ${{ env.TRUFFLE_HEAD }}
          extra_args: --only-verified --fail

  ci-gate:
    name: ai_review / CI Gate
    if: always()
    needs: [lint, typecheck, test, security-sast, security-sca]
    runs-on: ubuntu-latest
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          SAST: ${{ needs.security-sast.result }}
          SCA: ${{ needs.security-sca.result }}
        run: |
          echo "lint=$LINT typecheck=$TYPECHECK test=$TEST sast=$SAST sca=$SCA"
          if [ "$LINT" != "success" ] || [ "$TYPECHECK" != "success" ] || \
             [ "$TEST" != "success" ] || [ "$SAST" != "success" ] || \
             [ "$SCA" != "success" ]; then
            echo "::error::ai_review CI 未通过"
            exit 1
          fi
          echo "ai_review CI 全部通过 ✅"
