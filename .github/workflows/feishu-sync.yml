name: Feishu Sync

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync:
    name: Sync to Feishu (飞书同步)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (contains(github.event.head_commit.message, '[DEL-') ||
        contains(github.event.head_commit.message, '[PHASE-')))
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
      FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      EVENT_NAME: ${{ github.event_name }}
      COMMIT_SHA: ${{ github.sha }}
      REPO_NAME: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/sync_feishu.py
